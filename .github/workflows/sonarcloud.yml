name: SonarCloud Analysis

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis relevancy
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'  # Using .NET 10.0 as specified in the project
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build project
        run: dotnet build --configuration Release --no-restore
      
      - name: Run tests with code coverage
        run: dotnet test --configuration Release --no-build --verbosity normal /p:CollectCoverage=true /p:CoverageFormat=opencover /p:CoverageFilePath=coverage.xml
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        with:
          args: >
            -Dsonar.projectBaseDir=src/Flpcoliveira.TemplateMethodExporter
            -Dsonar.projectKey=flpcoliveira_template-method-exporter
            -Dsonar.organization=flpcoliveira
            -Dsonar.sources=.
            -Dsonar.tests=../../tests
            -Dsonar.coverage.exclusions=../../tests/**
            -Dsonar.cs.opencover.reportsPaths=../../coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage to SonarCloud
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
